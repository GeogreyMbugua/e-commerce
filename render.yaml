# Render Blueprint — AudioVintage production stack
# Docs: https://render.com/docs/blueprint-spec
#
# Apply from the Render dashboard: New > Blueprint > connect this repo.
# After the first deploy, set sync:false secrets in the dashboard.

services:
  - type: web
    name: audiovintage-api
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: >-
      npm install -g pnpm@10 &&
      pnpm install --frozen-lockfile --filter "./apps/api" &&
      pnpm api:generate &&
      pnpm api:build
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: LOG_LEVEL
        value: info
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: audiovintage-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: audiovintage-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        value: https://geogreymbugua.github.io
      - key: STOREFRONT_URL
        value: https://geogreymbugua.github.io
      - key: STOREFRONT_BASE_PATH
        value: /e-commerce
      - key: SMTP_FROM
        value: AudioVintage <orders@audiovintage.com>
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  - type: keyvalue
    name: audiovintage-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: audiovintage-db
    region: oregon
    plan: basic-256mb
    databaseName: audiovintage
    user: audiovintage
